- DOMAIN-SUFFIX,linkedin.com,PG-default
- DOMAIN-SUFFIX,subconverters.com,PG-Sage
- RULE-SET,anting,DIRECT
- RULE-SET,private,DIRECT
- RULE-SET,reject,REJECT
- RULE-SET,direct,DIRECT
- DOMAIN-SUFFIX,cn,DIRECT
- RULE-SET,cncidr,DIRECT,no-resolve
- RULE-SET,lancidr,DIRECT,no-resolve
- RULE-SET,tld-not-cn,PG-default
- RULE-SET,gfw,PG-default
- RULE-SET,greatfire,PG-default
- RULE-SET,telegramcidr,PG-default,no-resolve
- RULE-SET,google,PG-Google
- RULE-SET,proxy,PG-default
